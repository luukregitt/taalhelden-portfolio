<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taalhelden – Leerkracht</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #F0F2F5; color: #1a1a1a; }

#login-scherm { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.login-kaart { background: white; border-radius: 16px; padding: 40px 36px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); max-width: 360px; width: 100%; text-align: center; }
.login-kaart h1 { font-size: 20px; margin-bottom: 6px; }
.login-kaart p { font-size: 13px; color: #666; margin-bottom: 24px; }
.login-kaart input { width: 100%; border: 1.5px solid #ddd; border-radius: 8px; padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 12px; }
.login-kaart input:focus { border-color: #E0453C; }
.login-knop { width: 100%; background: #E0453C; color: white; border: none; border-radius: 8px; padding: 11px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; }
.login-knop:hover { background: #C13830; }
.login-fout { color: #e55; font-size: 13px; margin-top: 8px; display: none; }

#hoofd { display: none; padding: 24px 16px 48px; }
header { max-width: 1100px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; }
header h1 { font-size: 20px; font-weight: 700; }
.uitloggen { font-size: 12px; background: none; border: 1px solid #ccc; border-radius: 6px; padding: 5px 10px; cursor: pointer; color: #666; }

.filters { max-width: 1100px; margin: 0 auto 20px; background: white; border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); flex-wrap: wrap; }
.filters label { font-size: 13px; font-weight: 600; color: #444; white-space: nowrap; }
.filters select { border: 1.5px solid #ddd; border-radius: 8px; padding: 8px 12px; font-size: 14px; font-family: inherit; outline: none; background: #fafafa; cursor: pointer; min-width: 150px; }

.status { max-width: 1100px; margin: 0 auto 10px; font-size: 12px; color: #888; min-height: 18px; }
#overzicht { max-width: 1100px; margin: 0 auto; }
.geen-data { text-align: center; color: #999; font-size: 14px; margin-top: 40px; }

/* KLAS CONTAINER MET LEERLING TABBLADEN */
.klas-container { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 20px; }
.klas-titel { padding: 14px 20px; background: #E0453C; color: white; font-size: 15px; font-weight: 700; }

/* LEERLING TABBLADEN */
.leerling-tabs-balk { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px 16px; border-bottom: 1px solid #eee; background: #f8f9fa; }
.leerling-tab-knop { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; background: #E8EAF0; color: #555; border: none; font-family: inherit; transition: all 0.15s; }
.leerling-tab-knop:hover { background: #d0d4e0; }
.leerling-tab-knop.actief { background: #E0453C; color: white; }

/* LEERLING DETAIL */
.leerling-detail { display: none; padding: 20px; }
.leerling-detail.actief { display: block; }
.leerling-header-detail { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
.leerling-naam { font-size: 16px; font-weight: 700; }
.leerling-meta { font-size: 12px; color: #888; }
.klas-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: #E8EAF0; color: #444; margin-left: 8px; }
.acties-rij { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.verwijder-knop { font-size: 12px; color: #e55; background: none; border: 1px solid #e55; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.reset-pin-knop { font-size: 12px; color: #888; background: none; border: 1px solid #ddd; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.reset-pin-knop:hover { background: #f5f5f5; }

/* INHOUD TABS */
.inhoud-tabs { display: flex; gap: 0; flex-wrap: wrap; border-bottom: 1px solid #eee; margin-bottom: 16px; }
.inhoud-tab { padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; color: #888; border-bottom: 3px solid transparent; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; transition: all 0.15s; }
.inhoud-tab:hover { color: #333; }
.inhoud-tab.actief { color: #E0453C; border-bottom-color: #E0453C; }
.inhoud-tab.nederlands.actief { color: #2BAF84; border-bottom-color: #2BAF84; }
.inhoud-tab.lessen.actief { color: #2B579A; border-bottom-color: #2B579A; }
.inhoud-tab.vragen.actief { color: #F5A623; border-bottom-color: #F5A623; }
.inhoud-panel { display: none; }
.inhoud-panel.actief { display: block; }

/* MIJN TRAJECT (leerkracht) */
.traject-lk-rij { margin-bottom: 12px; background: #fafafa; border: 1px solid #eee; border-radius: 10px; padding: 12px 14px; }
.traject-lk-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.traject-lk-naam { font-size: 13px; font-weight: 700; color: #1a1a1a; flex: 1; min-width: 220px; }
.mini-balk { display: flex; gap: 3px; width: 100px; flex-shrink: 0; }
.mini-stap { flex: 1; height: 12px; border-radius: 3px; background: #E8EAF0; }
.mini-stap.actief { background: #E0453C; }
.mini-fase-select { font-family: inherit; font-size: 11px; border: 1.5px solid #ddd; border-radius: 6px; padding: 3px 6px; background: #fafafa; cursor: pointer; outline: none; }
.mini-fase-select:focus { border-color: #E0453C; }

/* HISTORIEK */
.historiek-rij { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.historiek-item { font-size: 10px; background: #f0f0f0; border-radius: 4px; padding: 2px 6px; color: #666; }
.historiek-item .pijl { color: #2BAF84; font-weight: 700; }

/* FEEDBACK */
.feedback-invoer { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 220px; margin-top: 8px; }
.feedback-invoer textarea { flex: 1; font-family: inherit; font-size: 12px; border: 1.5px solid #ddd; border-radius: 8px; padding: 5px 8px; resize: vertical; min-height: 32px; outline: none; background: #FFFBEA; }
.feedback-invoer textarea:focus { border-color: #F5C400; }

.leerling-acties-onder { display: flex; justify-content: flex-start; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.feedback-opslaan-knop { background: #F5C400; color: #333; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
.feedback-opslaan-knop:hover { background: #d4a900; }
.opslaan-bev { font-size: 12px; color: #2BAF84; font-weight: 600; display: none; }

/* MIJN NEDERLANDS (leerkracht) */
.nl-lk-rij { background: #fafafa; border: 1px solid #eee; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.nl-lk-header { font-size: 13px; font-weight: 700; margin-bottom: 10px; color: #1a1a1a; }
.nl-lk-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 900px) { .nl-lk-grid { grid-template-columns: repeat(2, 1fr); } }
.nl-lk-label { font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
.nl-lk-waarde { font-size: 12px; color: #333; line-height: 1.4; white-space: pre-wrap; }
.nl-lk-tip-veld { width: 100%; border: 1.5px solid #F5D97A; background: #FFFBEA; border-radius: 6px; padding: 6px 8px; font-size: 12px; font-family: inherit; resize: vertical; min-height: 50px; }
.nl-lk-tip-veld:focus { outline: none; border-color: #e0c04a; }

/* MIJN LESSEN (leerkracht) */
.ls-lk-rij { background: #fafafa; border: 1px solid #eee; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.ls-lk-week { font-size: 13px; font-weight: 700; color: #1A3A6B; margin-bottom: 8px; }
.ls-lk-tekst { font-size: 12px; color: #333; line-height: 1.4; white-space: pre-wrap; margin-bottom: 10px; }
.ls-lk-feedback-veld { width: 100%; border: 1.5px solid #F5D97A; background: #FFFBEA; border-radius: 6px; padding: 6px 8px; font-size: 12px; font-family: inherit; resize: vertical; min-height: 44px; }
.ls-lk-feedback-veld:focus { outline: none; border-color: #e0c04a; }

/* VRAGEN VAN OUDERS */
.vr-lk-rij { background: #fffaf0; border: 1px solid #F5D97A; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.vr-lk-datum { font-size: 11px; color: #aaa; margin-bottom: 6px; }
.vr-lk-vraag { font-size: 13px; color: #333; margin-bottom: 10px; font-weight: 600; }
.vr-lk-antwoord-veld { width: 100%; border: 1.5px solid #ddd; background: white; border-radius: 6px; padding: 6px 8px; font-size: 12px; font-family: inherit; resize: vertical; min-height: 44px; }
.vr-lk-antwoord-veld:focus { outline: none; border-color: #F5A623; }

/* TOEKOMST */
.toekomst-sectie { margin-bottom: 20px; }
.toekomst-sectie h4 { font-size: 13px; font-weight: 700; color: #555; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
.toekomst-veld { display: flex; gap: 8px; margin-bottom: 8px; }
.toekomst-sleutel { font-size: 12px; font-weight: 600; color: #888; min-width: 180px; flex-shrink: 0; }
.toekomst-waarde { font-size: 12px; color: #333; }
.talent-rij { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.talent-naam-lk { font-size: 12px; color: #555; min-width: 160px; }
.talent-mini-balk { display: flex; gap: 3px; }
.talent-mini-stap { width: 18px; height: 12px; border-radius: 3px; background: #E8EAF0; }
.talent-mini-stap.actief { background: #7C6FD4; }
</style>
</head>
<body>

<div id="login-scherm">
  <div class="login-kaart">
    <h1>🎓 Leerkrachtenpagina</h1>
    <p>Voer het wachtwoord in om verder te gaan.</p>
    <input type="password" id="wachtwoord-input" placeholder="Wachtwoord…" onkeydown="if(event.key==='Enter') controleerWachtwoord()">
    <button class="login-knop" onclick="controleerWachtwoord()">Inloggen</button>
    <p class="login-fout" id="login-fout">Ongeldig wachtwoord.</p>
    <a href="index.html" style="display:block;text-align:center;margin-top:16px;font-size:13px;color:#888;text-decoration:none;">🏠 Terug naar startpagina</a>
  </div>
</div>

<div id="hoofd">
  <header>
    <div><h1>🦸 Leerkrachtenoverzicht – Taalhelden</h1><p style="font-size:13px;color:#666;">Mijn traject · Mijn Nederlands · Mijn toekomst · Mijn lessen · Vragen van ouders</p></div>
    <button class="uitloggen" onclick="uitloggen()">↩ Uitloggen</button>
  </header>

  <div class="filters">
    <label>Klas:</label>
    <select id="klas-filter" onchange="laadKlas()">
      <option value="">— Kies een klas —</option>
      <option value="wit">Wit</option><option value="zwart">Zwart</option><option value="roze">Roze</option>
      <option value="oranje">Oranje</option><option value="paars">Paars</option><option value="mint">Mint</option>
      <option value="rood">Rood</option><option value="blauw">Blauw</option><option value="geel">Geel</option>
      <option value="groen">Groen</option><option value="goud">Goud</option><option value="zilver">Zilver</option>
    </select>
    <button onclick="laadKlas()" style="background:#E0453C;color:white;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;">🔄 Vernieuwen</button>
    <span id="laatste-update" style="font-size:11px;color:#aaa;"></span>
  </div>

  <div class="status" id="status"></div>
  <div id="overzicht"><p class="geen-data">Kies een klas om te beginnen.</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, deleteDoc, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8o-_FR2mvEciuxDgkfY__XRF_VtAZwUM",
  authDomain: "okan-leerdoelen.firebaseapp.com",
  projectId: "okan-leerdoelen",
  storageBucket: "okan-leerdoelen.firebasestorage.app",
  messagingSenderId: "767763105714",
  appId: "1:767763105714:web:4a79429a484b22a30d06ab"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const WACHTWOORD = "taalhelden2025";

window.controleerWachtwoord = function() {
  if (document.getElementById('wachtwoord-input').value === WACHTWOORD) {
    document.getElementById('login-scherm').style.display='none';
    document.getElementById('hoofd').style.display='block';
    sessionStorage.setItem('taalhelden_auth','1');
  } else { document.getElementById('login-fout').style.display='block'; }
};

window.uitloggen = function() {
  sessionStorage.removeItem('taalhelden_auth');
  document.getElementById('login-scherm').style.display='flex';
  document.getElementById('hoofd').style.display='none';
  document.getElementById('wachtwoord-input').value='';
};
if (sessionStorage.getItem('taalhelden_auth')==='1') {
  document.getElementById('login-scherm').style.display='none';
  document.getElementById('hoofd').style.display='block';
}

const FASE_LABELS = ["Nog niet begonnen","Fase 1","Fase 2","Fase 3","Fase 4","Fase 5"];

// MIJN TRAJECT — 6 hoofddoelen
const TRAJECT_DOELEN = [
  {id:'lezen',          icoon:'📖', naam:'Vlot en vloeiend lezen'},
  {id:'schrijvendelen', icoon:'✉️', naam:'Schrijven om te delen'},
  {id:'schrijvenleren', icoon:'📝', naam:'Schrijven om te leren / notities nemen'},
  {id:'spreken',        icoon:'🗣️', naam:'Mondeling taalgebruik: spreken'},
  {id:'interactie',     icoon:'💬', naam:'Mondeling taalgebruik: interactie'},
  {id:'autonomie',      icoon:'🧭', naam:'Ondersteuning en autonomie'},
];

const talenten = [
  {id:"zelfstandig",naam:"Zelfstandig"},{id:"initiatief",naam:"Initiatief nemen"},{id:"doorzetting",naam:"Doorzettingsvermogen"},
  {id:"planmatig",naam:"Planmatig"},{id:"flexibel",naam:"Flexibel"},{id:"technisch",naam:"Technisch inzicht"},
  {id:"veilig",naam:"Veilig"},{id:"zorgzaam",naam:"Zorgzaam"},{id:"sociaal",naam:"Sociaal"},
  {id:"leiderschap",naam:"Leiderschap"},{id:"digitaal",naam:"Digitaal inzicht"},{id:"handig",naam:"Handig"},
  {id:"actief",naam:"Actief"},{id:"ruimtelijk",naam:"Ruimtelijk inzicht"},{id:"wiskundig",naam:"Wiskundig"},
  {id:"communicatief",naam:"Communicatief"},{id:"leergierig",naam:"Leergierig"},{id:"talig",naam:"Talig"},
  {id:"creatief",naam:"Creatief"},{id:"nauwkeurig",naam:"Nauwkeurig"},{id:"probleemoplossend",naam:"Probleemoplossend"},
  {id:"kritisch",naam:"Kritisch"},{id:"zelfkennis",naam:"Zelfkennis"},
];

let huidigeKlas = '';
let huidigeLeerlingen = [];
function setStatus(msg) { document.getElementById('status').textContent=msg; }

let unsubscribe = null;

window.laadKlas = async function() {
  const klas = document.getElementById('klas-filter').value;
  huidigeKlas = klas;
  document.getElementById('overzicht').innerHTML='<p class="geen-data">Laden…</p>';
  huidigeLeerlingen=[];

  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  if (!klas) { document.getElementById('overzicht').innerHTML='<p class="geen-data">Kies een klas.</p>'; return; }
  setStatus('⏳ Laden…');

  let eersteKeer = true;
  unsubscribe = onSnapshot(collection(db,'taalhelden_klassen',klas,'leerlingen'), (snap) => {
    const nieuweData = [];
    snap.forEach(d => {
      const ldata = d.data();
      ldata.toekomst = null;
      nieuweData.push({...ldata, _id:d.id});
    });

    setStatus('');
    const nu = new Date().toLocaleTimeString('nl-BE');
    document.getElementById('laatste-update').textContent = `Laatste update: ${nu}`;

    if (nieuweData.length===0) {
      document.getElementById('overzicht').innerHTML='<p class="geen-data">Nog geen leerlingen in deze klas.</p>';
      huidigeLeerlingen = [];
      return;
    }

    if (eersteKeer) {
      huidigeLeerlingen = nieuweData;
      toonKlasMetTabbladen(klas, huidigeLeerlingen);
      eersteKeer = false;
    } else {
      nieuweData.forEach((data, index) => {
        huidigeLeerlingen[index] = {...huidigeLeerlingen[index], ...data};
        const lid = `L_${klas}_${index}`;
        TRAJECT_DOELEN.forEach(item => {
          const fase = data.traject?.[item.id]?.fase || 0;
          const faseSelectId = `fs_${lid}_${item.id}`;
          const selectEl = document.getElementById(faseSelectId);
          if (selectEl && parseInt(selectEl.value) !== fase) {
            selectEl.value = fase;
            const rij = selectEl.closest('.traject-lk-top');
            if (rij) {
              const stappen = rij.querySelectorAll('.mini-stap');
              stappen.forEach((s,i) => { s.classList.toggle('actief', i<fase); });
            }
          }
        });
        const metaEl = document.querySelector(`#detail_${klas}_${index} .leerling-meta`);
        if (metaEl) metaEl.textContent = `Opgeslagen: ${data.tijdstip||'–'}`;
      });
    }
  }, (error) => {
    setStatus('⚠️ Laadprobleem: ' + error.message);
  });
};

function toonKlasMetTabbladen(klas, leerlingen) {
  const overzicht = document.getElementById('overzicht');
  overzicht.innerHTML = '';
  const container = document.createElement('div');
  container.className = 'klas-container';
  container.innerHTML = `<div class="klas-titel">Klas ${klas.charAt(0).toUpperCase()+klas.slice(1)}</div>
    <div class="leerling-tabs-balk" id="leerling-tabs-balk"></div>`;
  overzicht.appendChild(container);

  const tabsBalk = container.querySelector('#leerling-tabs-balk');

  leerlingen.forEach((data, index) => {
    const tabKnop = document.createElement('button');
    tabKnop.className = 'leerling-tab-knop' + (index===0?' actief':'');
    tabKnop.textContent = data.naam;
    tabKnop.onclick = () => {
      container.querySelectorAll('.leerling-tab-knop').forEach(t=>t.classList.remove('actief'));
      container.querySelectorAll('.leerling-detail').forEach(d=>d.classList.remove('actief'));
      tabKnop.classList.add('actief');
      document.getElementById(`detail_${klas}_${index}`).classList.add('actief');
    };
    tabsBalk.appendChild(tabKnop);

    const detail = document.createElement('div');
    detail.className = 'leerling-detail' + (index===0?' actief':'');
    detail.id = `detail_${klas}_${index}`;
    const lid = `L_${klas}_${index}`;

    let html = `<div class="leerling-header-detail">
      <div><span class="leerling-naam">${data.naam}</span><span class="klas-badge">${data.klas}</span>
      ${data.pincode?'<span style="font-size:11px;color:#2BAF84;margin-left:8px;">🔒 Pincode ingesteld</span>':'<span style="font-size:11px;color:#aaa;margin-left:8px;">Geen pincode</span>'}
      </div>
      <div class="acties-rij">
        <span class="leerling-meta">Opgeslagen: ${data.tijdstip||'–'}</span>
        <button class="reset-pin-knop" onclick="resetPin('${klas}','${data.naam}')">🔑 Reset pincode</button>
        <button class="verwijder-knop" onclick="verwijder('${klas}','${data.naam}',${index})">✕ Verwijder</button>
      </div>
    </div>`;

    html += `<div class="inhoud-tabs">
      <button class="inhoud-tab actief" onclick="inhoudTab('${lid}','traject',this)">🧭 Mijn traject</button>
      <button class="inhoud-tab nederlands" onclick="inhoudTab('${lid}','nederlands',this)">🇳🇱 Mijn Nederlands</button>
      <button class="inhoud-tab" onclick="inhoudTab('${lid}','toekomst',this)">🌟 Mijn toekomst</button>
      <button class="inhoud-tab lessen" onclick="inhoudTab('${lid}','lessen',this)">📅 Mijn lessen</button>
      <button class="inhoud-tab vragen" onclick="inhoudTab('${lid}','vragen',this)">❓ Vragen van ouders</button>
    </div>`;

    // PANEL MIJN TRAJECT
    html += `<div class="inhoud-panel actief" id="${lid}-traject">`;
    TRAJECT_DOELEN.forEach(item => {
      const fase = data.traject?.[item.id]?.fase || 0;
      const feedback = data.traject?.[item.id]?.feedback || '';
      const historiek = data.traject?.[item.id]?.historiek || [];
      const balkHTML = [1,2,3,4,5].map(i=>`<div class="mini-stap${i<=fase?' actief':''}"></div>`).join('');
      const faseSelectId = `fs_${lid}_${item.id}`;
      const fbId = `fb_${lid}_${item.id}`;
      const faseOpties = FASE_LABELS.map((l,i)=>`<option value="${i}"${i===fase?' selected':''}>${l}</option>`).join('');
      const historiekHTML = historiek.length>0
        ? historiek.map(h=>`<span class="historiek-item">${h.datum}: <span class="pijl">→</span> ${FASE_LABELS[h.fase]||'fase '+h.fase}</span>`).join('')
        : '';
      html += `<div class="traject-lk-rij">
        <div class="traject-lk-top">
          <span class="traject-lk-naam">${item.icoon} ${item.naam}</span>
          <div class="mini-balk">${balkHTML}</div>
          <select class="mini-fase-select" id="${faseSelectId}" onchange="updateMiniBalk(this)">${faseOpties}</select>
        </div>
        <div class="feedback-invoer"><textarea id="${fbId}" placeholder="Feedback…" rows="1">${feedback}</textarea></div>
        ${historiekHTML?`<div class="historiek-rij">${historiekHTML}</div>`:''}
      </div>`;
    });
    html += `<div class="leerling-acties-onder">
      <button class="feedback-opslaan-knop" id="knop_${lid}" onclick="slaTrajectOp('${klas}','${data.naam}','${lid}')">💾 Opslaan</button>
      <span class="opslaan-bev" id="bev_${lid}">✅ Opgeslagen!</span>
    </div></div>`;

    // PANEL NEDERLANDS - lui geladen
    html += `<div class="inhoud-panel" id="${lid}-nederlands"><p style="color:#aaa;font-size:13px;padding:16px;">Klik op dit tabblad om de Nederlands-data te laden.</p></div>`;
    // PANEL TOEKOMST - lui geladen
    html += `<div class="inhoud-panel" id="${lid}-toekomst"><p style="color:#aaa;font-size:13px;padding:16px;">Klik op dit tabblad om de toekomstdata te laden.</p></div>`;
    // PANEL LESSEN - lui geladen
    html += `<div class="inhoud-panel" id="${lid}-lessen"><p style="color:#aaa;font-size:13px;padding:16px;">Klik op dit tabblad om Mijn lessen te laden.</p></div>`;
    // PANEL VRAGEN - lui geladen
    html += `<div class="inhoud-panel" id="${lid}-vragen"><p style="color:#aaa;font-size:13px;padding:16px;">Klik op dit tabblad om de vragen te laden.</p></div>`;

    detail.innerHTML = html;
    container.appendChild(detail);
  });
}

window.updateMiniBalk = function(select) {
  const val=parseInt(select.value);
  const rij=select.closest('.traject-lk-top');
  const stappen=rij.querySelectorAll('.mini-stap');
  stappen.forEach((s,i)=>{ s.classList.toggle('actief', i<val); });
};

window.slaTrajectOp = async function(klas, naam, lid) {
  const knop=document.getElementById(`knop_${lid}`);
  const bev=document.getElementById(`bev_${lid}`);
  knop.disabled=true;
  const nu = new Date().toLocaleDateString('nl-BE');

  const ref = doc(db,'taalhelden_klassen',klas,'leerlingen',naam);
  const snap = await getDoc(ref);
  const bestaand = snap.exists() ? snap.data() : {};
  const oudTraject = bestaand.traject || {};
  const nieuwTraject = {};

  TRAJECT_DOELEN.forEach(item => {
    const faseEl = document.getElementById(`fs_${lid}_${item.id}`);
    const fbEl = document.getElementById(`fb_${lid}_${item.id}`);
    const nieuweFase = faseEl ? parseInt(faseEl.value) : 0;
    const oudeFase = oudTraject[item.id]?.fase || 0;
    const hist = oudTraject[item.id]?.historiek || [];
    if (nieuweFase !== oudeFase && nieuweFase > 0) hist.push({datum:nu, fase:nieuweFase});
    nieuwTraject[item.id] = {fase: nieuweFase, feedback: fbEl?fbEl.value.trim():'', historiek: hist};
  });

  try {
    await setDoc(ref, {...bestaand, traject: nieuwTraject, tijdstip: new Date().toLocaleString('nl-BE')});
    const l = huidigeLeerlingen.find(l=>l.naam===naam);
    if (l) l.traject = nieuwTraject;
    bev.style.display='inline'; setTimeout(()=>bev.style.display='none',3000);
  } catch(e){ alert('Opslaan mislukt.'); }
  knop.disabled=false;
};

function bouwToekomstPanel(data, klas, lid) {
  const t = data.toekomst;
  if (!t) return `<p style="color:#aaa;font-size:13px;padding:16px;">Nog niets ingevuld bij 'Mijn toekomst'.</p>`;
  let html = '';
  if (t.wiebenik) {
    html += `<div class="toekomst-sectie"><h4>👤 Wie ben ik?</h4>`;
    [['naam','Naam'],['leeftijd','Leeftijd'],['hobbys',"Hobby's"],['persoon','Belangrijk persoon'],['plek','Favoriete plaats']].forEach(([k,label])=>{
      if(t.wiebenik[k]) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">${label}</span><span class="toekomst-waarde">${t.wiebenik[k]}</span></div>`;
    });
    if (t.wiebenik.vaklabels) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">Favoriete vakken</span><span class="toekomst-waarde">${t.wiebenik.vaklabels}</span></div>`;
    html += `</div>`;
  }
  if (t.dromen) {
    html += `<div class="toekomst-sectie"><h4>🌟 Mijn dromen</h4>`;
    [['kinderjob','Droomjob als kind'],['nujob','Droomjob nu']].forEach(([k,label])=>{
      if(t.dromen[k]) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">${label}</span><span class="toekomst-waarde">${t.dromen[k]}</span></div>`;
    });
    if (t.dromen.interesseLabels) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">Interesses</span><span class="toekomst-waarde">${t.dromen.interesseLabels}</span></div>`;
    html += `</div>`;
  }
  if (t.hoeleerik) {
    const leerwijzeLabels={doen:'Al doende leren',boek:'Uit boeken leren',beide:'Beide'};
    const studieLabels={graag:'Graag studeren',mindergraag:'Minder graag studeren'};
    const hulpItems=['rust','muziek','herhalen','uitleggen','plaatjes','pauzes'].filter(k=>t.hoeleerik['help_'+k]).join(', ');
    html+=`<div class="toekomst-sectie"><h4>📖 Hoe leer ik?</h4>`;
    if(t.hoeleerik.leerwijze) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">Zo leer ik</span><span class="toekomst-waarde">${leerwijzeLabels[t.hoeleerik.leerwijze]||t.hoeleerik.leerwijze}</span></div>`;
    if(t.hoeleerik.studiehouding) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">Studiehouding</span><span class="toekomst-waarde">${studieLabels[t.hoeleerik.studiehouding]||t.hoeleerik.studiehouding}</span></div>`;
    if(hulpItems) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">Wat helpt</span><span class="toekomst-waarde">${hulpItems}</span></div>`;
    if(t.hoeleerik.extra) html+=`<div class="toekomst-veld"><span class="toekomst-sleutel">Extra</span><span class="toekomst-waarde">${t.hoeleerik.extra}</span></div>`;
    html+=`</div>`;
  }
  if (t.talenten) {
    html+=`<div class="toekomst-sectie"><h4>💪 Talenten</h4>`;
    talenten.forEach(tal=>{
      const val=t.talenten[tal.id]||0;
      if(val>0){
        const kleur=['#FF3B30','#FF9500','#FFCC00','#A8E063','#34C759'];
        const balkHTML=[1,2,3,4,5].map(i=>`<div class="talent-mini-stap${i<=val?' actief':''}" style="${i<=val?'background:'+kleur[i-1]:''}"></div>`).join('');
        html+=`<div class="talent-rij"><span class="talent-naam-lk">${tal.naam}</span><div class="talent-mini-balk">${balkHTML}</div><span style="font-size:11px;color:#aaa;margin-left:4px;">${val}/5</span></div>`;
      }
    });
    html+=`</div>`;
  }
  if (t.nederlandsThuis && t.nederlandsThuis.length) {
    html += `<div class="toekomst-sectie"><h4>🇳🇱 Nederlands thuis</h4>`;
    t.nederlandsThuis.forEach(item => {
      html += `<div class="toekomst-veld" style="display:block;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #f0f0f0;">
        <div style="font-size:11px;color:#aaa;margin-bottom:4px;">${item.datum||''}</div>
        ${item.link ? `<div class="toekomst-veld"><span class="toekomst-sleutel">Link</span><span class="toekomst-waarde"><a href="${item.link}" target="_blank" rel="noopener">${item.link}</a></span></div>` : ''}
        ${item.watIsHet ? `<div class="toekomst-veld"><span class="toekomst-sleutel">Wat is het?</span><span class="toekomst-waarde">${item.watIsHet.charAt(0).toUpperCase()+item.watIsHet.slice(1)}</span></div>` : ''}
        ${item.uitleg ? `<div class="toekomst-veld"><span class="toekomst-sleutel">Leg uit wat je gedaan hebt</span><span class="toekomst-waarde">${item.uitleg}</span></div>` : ''}
        ${item.watLeerde ? `<div class="toekomst-veld"><span class="toekomst-sleutel">Wat heb ik eruit geleerd?</span><span class="toekomst-waarde">${item.watLeerde}</span></div>` : ''}
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}

window.inhoudTab = async function(lid, panel, el) {
  const kaart = el.closest('.leerling-detail');
  kaart.querySelectorAll('.inhoud-tab').forEach(t=>t.classList.remove('actief'));
  kaart.querySelectorAll('.inhoud-panel').forEach(p=>p.classList.remove('actief'));
  el.classList.add('actief');
  const panelEl = document.getElementById(`${lid}-${panel}`);
  panelEl.classList.add('actief');

  const parts = lid.split('_');
  const index = parseInt(parts[parts.length-1]);
  const leerling = huidigeLeerlingen[index];
  const klas = document.getElementById('klas-filter').value;
  if (!leerling) return;

  if (panel === 'toekomst' && panelEl.dataset.geladen !== '1') {
    panelEl.innerHTML = '<p style="padding:16px;color:#aaa;font-size:13px;">⏳ Toekomstdata laden…</p>';
    try {
      const tSnap = await getDoc(doc(db,'taalhelden_klassen',klas,'toekomst',leerling.naam));
      leerling.toekomst = tSnap.exists() ? tSnap.data() : null;
    } catch(e) { leerling.toekomst = null; }
    panelEl.innerHTML = bouwToekomstPanel(leerling, klas, lid);
    panelEl.dataset.geladen = '1';
  }

  if (panel === 'nederlands' && panelEl.dataset.geladen !== '1') {
    panelEl.innerHTML = '<p style="padding:16px;color:#aaa;font-size:13px;">⏳ Nederlands-data laden…</p>';
    let nd = null;
    try {
      const nSnap = await getDoc(doc(db,'taalhelden_klassen',klas,'nederlands',leerling.naam));
      nd = nSnap.exists() ? nSnap.data() : null;
    } catch(e) { nd = null; }
    panelEl.innerHTML = bouwNederlandsPanel(nd, klas, leerling.naam, lid);
    panelEl.dataset.geladen = '1';
  }

  if (panel === 'lessen' && panelEl.dataset.geladen !== '1') {
    panelEl.innerHTML = '<p style="padding:16px;color:#aaa;font-size:13px;">⏳ Mijn lessen laden…</p>';
    let ld = null;
    try {
      const lSnap = await getDoc(doc(db,'taalhelden_klassen',klas,'lessen',leerling.naam));
      ld = lSnap.exists() ? lSnap.data() : null;
    } catch(e) { ld = null; }
    panelEl.innerHTML = bouwLessenPanel(ld, klas, leerling.naam, lid);
    panelEl.dataset.geladen = '1';
  }

  if (panel === 'vragen' && panelEl.dataset.geladen !== '1') {
    panelEl.innerHTML = '<p style="padding:16px;color:#aaa;font-size:13px;">⏳ Vragen laden…</p>';
    let vd = null;
    try {
      const vSnap = await getDoc(doc(db,'taalhelden_klassen',klas,'vragen',leerling.naam));
      vd = vSnap.exists() ? vSnap.data() : null;
    } catch(e) { vd = null; }
    panelEl.innerHTML = bouwVragenPanel(vd, klas, leerling.naam, lid);
    panelEl.dataset.geladen = '1';
  }
};

window.resetPin = async function(klas, naam) {
  if(!confirm(`Pincode van ${naam} resetten? De leerling kan daarna een nieuwe pincode instellen.`)) return;
  try {
    const ref = doc(db,'taalhelden_klassen',klas,'leerlingen',naam);
    const snap = await getDoc(ref);
    const bestaand = snap.exists() ? snap.data() : {};
    await setDoc(ref, {...bestaand, pincode: null});
    alert(`Pincode van ${naam} is gereset. De leerling kan nu een nieuwe pincode kiezen.`);
    laadKlas();
  } catch(e){alert('Reset mislukt.');}
};

window.verwijder = async function(klas, naam, index) {
  if(!confirm(`Verwijder alle data van ${naam}?`)) return;
  try {
    await deleteDoc(doc(db,'taalhelden_klassen',klas,'leerlingen',naam));
    await deleteDoc(doc(db,'taalhelden_klassen',klas,'toekomst',naam));
    await deleteDoc(doc(db,'taalhelden_klassen',klas,'nederlands',naam));
    await deleteDoc(doc(db,'taalhelden_klassen',klas,'lessen',naam));
    await deleteDoc(doc(db,'taalhelden_klassen',klas,'vragen',naam));
    huidigeLeerlingen=huidigeLeerlingen.filter(l=>l.naam!==naam);
    laadKlas();
  } catch(e){alert('Verwijderen mislukt.');}
};
