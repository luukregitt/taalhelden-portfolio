<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taalhelden</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #F0F2F5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .container { max-width: 460px; width: 100%; text-align: center; }
  .logo { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 24px; font-weight: 700; color: #1a1a1a; margin-bottom: 6px; }
  .subtitel { font-size: 14px; color: #666; margin-bottom: 40px; }
  .knoppen { display: flex; flex-direction: column; gap: 16px; }
  .knop { display: flex; align-items: center; gap: 20px; background: white; border: none; border-radius: 16px; padding: 24px 28px; text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,0.09); transition: transform 0.15s, box-shadow 0.15s; cursor: pointer; border-left: 6px solid; text-align: left; }
  .knop:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.13); }
  .knop-leerling   { border-color: #E0453C; }
  .knop-leerkracht { border-color: #2B579A; }
  .knop-ouders     { border-color: #F5A623; }
  .knop-icoon { font-size: 36px; flex-shrink: 0; }
  .knop-titel { font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 3px; }
  .knop-sub { font-size: 13px; color: #888; }
  .pijl { font-size: 20px; color: #ccc; margin-left: auto; flex-shrink: 0; }
  footer { margin-top: 40px; font-size: 12px; color: #bbb; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">🦸</div>
  <h1>Taalhelden</h1>
  <p class="subtitel">Kies hieronder wie je bent.</p>
  <div class="knoppen">
    <a class="knop knop-leerling" href="taalhelden_leerling.html">
      <span class="knop-icoon">🦸</span>
      <div>
        <div class="knop-titel">Ik ben een leerling</div>
        <div class="knop-sub">Mijn Nederlands · Mijn traject · Mijn toekomst · Mijn lessen</div>
      </div>
      <span class="pijl">→</span>
    </a>
    <a class="knop knop-leerkracht" href="taalhelden_leerkracht.html">
      <span class="knop-icoon">🎓</span>
      <div>
        <div class="knop-titel">Ik ben een leerkracht</div>
        <div class="knop-sub">Overzicht · Feedback · Per klas filteren</div>
      </div>
      <span class="pijl">→</span>
    </a>
    <a class="knop knop-ouders" href="taalhelden_ouder.html">
      <span class="knop-icoon">👪</span>
      <div>
        <div class="knop-titel">Ik ben een ouder</div>
        <div class="knop-sub">Traject van je kind · Vragen stellen</div>
      </div>
      <span class="pijl">→</span>
    </a>
  </div>
  <footer>Taalhelden</footer>
</div>
</body>
</html>
